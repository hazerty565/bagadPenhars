name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check, lint et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Vérifier la version pnpm
        run: pnpm --version

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier Svelte et TypeScript
        run: pnpm run check

      - name: Vérifier le formatage et ESLint
        run: pnpm run lint

      - name: Construire l'application
        run: pnpm run build
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/placeholder
          BETTER_AUTH_API_KEY: build-placeholder-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:5173
